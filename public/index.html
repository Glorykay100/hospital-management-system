<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Hospital Management System" />
  <title>HMS · Hospital Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2'><path d='M12 2v20M2 12h20'/></svg>">
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v20M2 12h20"/>
      </svg>
      <span>HMS</span>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item active" data-page="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        <span>Dashboard</span>
      </button>
      <button class="nav-item" data-page="patients">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Patients</span>
      </button>
      <button class="nav-item" data-page="wards">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v11h18V7"/><path d="M3 7l2-3h14l2 3"/><path d="M12 12v6"/><path d="M9 15h6"/></svg>
        <span>Wards</span>
      </button>
      <button class="nav-item" data-page="doctors">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6"/><circle cx="12" cy="10" r="2"/><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/></svg>
        <span>Doctors</span>
      </button>
      <button class="nav-item" data-page="assignments">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span>Admissions</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar">CT</div>
        <div class="user-info">
          <div class="user-name">Care Team</div>
          <div class="user-role">Clinical workspace</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn mobile-menu-btn" id="menuToggle" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="topbar-title">
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageSubtitle">Overview of hospital activity</p>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" title="Notifications" id="notifBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="notif-dot" id="notifDot" hidden></span>
        </button>
      </div>
    </header>

    <main class="content">

      <!-- DASHBOARD -->
      <section class="page active" id="page-dashboard">
        <div class="toolbar">
          <div class="toolbar-info">Patient flow and ward capacity</div>
          <button class="btn-primary" data-goto="assignments">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            New Admission
          </button>
        </div>
        <div id="alertsStrip"></div>
        <div class="stat-grid" id="statGrid"></div>
        <div class="panel-grid">
          <div class="card">
            <div class="card-header">
              <h2>Ward Occupancy</h2>
              <button class="btn-ghost" data-goto="wards">View all</button>
            </div>
            <div class="occupancy-list" id="occupancyList"></div>
          </div>
          <div class="card">
            <div class="card-header">
              <h2>Recent Care Activity</h2>
              <button class="btn-ghost" data-goto="assignments">View all</button>
            </div>
            <div class="recent-list" id="recentList"></div>
          </div>
        </div>
      </section>

      <!-- PATIENTS -->
      <section class="page" id="page-patients">
        <div class="toolbar">
          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="text" id="patientSearch" placeholder="Search patients… (press /)" />
          </div>
          <button class="btn-primary" id="addPatientBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Add Patient
          </button>
        </div>
        <div class="card table-card" id="patientsTableWrap"></div>
      </section>

      <!-- WARDS -->
      <section class="page" id="page-wards">
        <div class="toolbar">
          <div class="toolbar-info" id="wardsSummary"></div>
          <button class="btn-primary" id="addWardBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Add Ward
          </button>
        </div>
        <div class="ward-grid" id="wardGrid"></div>
      </section>

      <!-- DOCTORS -->
      <section class="page" id="page-doctors">
        <div class="toolbar">
          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="text" id="doctorSearch" placeholder="Search doctors…" />
          </div>
          <button class="btn-primary" id="addDoctorBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Add Doctor
          </button>
        </div>
        <div class="card table-card" id="doctorsTableWrap"></div>
      </section>

      <!-- ASSIGNMENTS -->
      <section class="page" id="page-assignments">
        <div class="card assign-form-card">
          <div class="card-header">
            <div>
              <h2>New Admission</h2>
              <p class="muted">Place a patient in an available ward and link their clinician.</p>
            </div>
          </div>
          <form class="assign-form" id="assignForm">
            <div class="form-row">
              <div class="form-field">
                <label for="assignPatient">Patient <span class="req">*</span></label>
                <select id="assignPatient" required></select>
              </div>
              <div class="form-field">
                <label for="assignWard">Ward <span class="req">*</span></label>
                <select id="assignWard" required></select>
              </div>
              <div class="form-field">
                <label for="assignDoctor">Doctor <span class="muted">(optional)</span></label>
                <select id="assignDoctor"></select>
              </div>
            </div>
            <div class="form-field">
              <label for="assignNotes">Notes <span class="muted">(optional)</span></label>
              <textarea id="assignNotes" rows="2" placeholder="Reason, symptoms, special instructions…"></textarea>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn-primary" id="assignSubmitBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                Create Admission
              </button>
            </div>
          </form>
        </div>

        <div class="tabs" id="assignTabs">
          <button class="tab active" data-tab="active">Active Admissions</button>
          <button class="tab" data-tab="history">Past Admissions</button>
        </div>
        <div class="card table-card" id="assignmentsTableWrap"></div>
      </section>

    </main>
  </div>

  <!-- Toast host -->
  <div class="toast-host" id="toastHost"></div>

  <!-- Modal host -->
  <div class="modal-host" id="modalHost" hidden></div>

  <!-- Scripts (order matters) -->
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/patients-compact.js"></script>
  <script src="/js/wards.js"></script>
  <script src="/js/doctors.js"></script>
  <script src="/js/assignments.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
