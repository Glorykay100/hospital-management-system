services:
  - type: web
    name: hospital-management-system
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-db
          property: connectionString

databases:
  - name: hospital-db
    plan: free
